<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef8f1"/>
      <stop offset="1" stop-color="#cfeeda"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2" fill="#009c39" fill-opacity=".10"/>
    </pattern>
    <linearGradient id="sky1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e3f5e9"/>
      <stop offset="1" stop-color="#bfe6cc"/>
    </linearGradient>
    <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d4f0dd"/>
      <stop offset="1" stop-color="#9fdbb4"/>
    </linearGradient>
    <linearGradient id="sky3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff7e0"/>
      <stop offset="1" stop-color="#d9f1e1"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14b04d"/>
      <stop offset="1" stop-color="#007a2c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="26" flood-color="#00591f" flood-opacity=".22"/>
    </filter>
    <filter id="shadowSm" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#00591f" flood-opacity=".25"/>
    </filter>
    <clipPath id="c1"><rect x="34" y="34" width="372" height="272" rx="14"/></clipPath>
    <clipPath id="c2"><rect x="34" y="34" width="452" height="322" rx="16"/></clipPath>
    <clipPath id="c3"><rect x="30" y="30" width="320" height="232" rx="12"/></clipPath>
  </defs>

  <!-- Fond -->
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#dots)"/>
  <circle cx="1240" cy="190" r="300" fill="#ffffff" fill-opacity=".45"/>
  <circle cx="330" cy="860" r="240" fill="#009c39" fill-opacity=".07"/>
  <circle cx="800" cy="500" r="420" fill="none" stroke="#009c39" stroke-opacity=".10" stroke-width="2" stroke-dasharray="6 14"/>

  <!-- Cadre arrière gauche -->
  <g transform="translate(330 250) rotate(-9 220 200)" filter="url(#shadow)">
    <rect width="440" height="400" rx="22" fill="#ffffff"/>
    <g clip-path="url(#c1)">
      <rect x="34" y="34" width="372" height="272" fill="url(#sky1)"/>
      <circle cx="320" cy="110" r="34" fill="#ffd36b"/>
      <path d="M34 270 L140 170 L215 235 L290 160 L406 260 L406 306 L34 306 Z" fill="#5cc483"/>
      <path d="M34 306 L120 240 L200 290 L300 220 L406 300 L406 306 Z" fill="#009c39"/>
    </g>
    <rect x="34" y="330" width="190" height="14" rx="7" fill="#e3efe7"/>
    <rect x="34" y="356" width="120" height="12" rx="6" fill="#eef5f0"/>
  </g>

  <!-- Cadre arrière droit -->
  <g transform="translate(870 290) rotate(8 190 160)" filter="url(#shadow)">
    <rect width="380" height="340" rx="20" fill="#ffffff"/>
    <g clip-path="url(#c3)">
      <rect x="30" y="30" width="320" height="232" fill="url(#sky3)"/>
      <circle cx="105" cy="100" r="28" fill="#ffc94a" fill-opacity=".9"/>
      <path d="M30 230 C110 170 170 200 230 170 C280 145 320 160 350 150 L350 262 L30 262 Z" fill="#7fd29c"/>
      <path d="M30 262 C120 220 200 245 350 210 L350 262 Z" fill="#00a13c"/>
    </g>
    <rect x="30" y="282" width="160" height="13" rx="6.5" fill="#e3efe7"/>
    <rect x="30" y="306" width="100" height="11" rx="5.5" fill="#eef5f0"/>
  </g>

  <!-- Cadre principal -->
  <g transform="translate(545 205)" filter="url(#shadow)">
    <rect width="520" height="470" rx="26" fill="#ffffff"/>
    <g clip-path="url(#c2)">
      <rect x="34" y="34" width="452" height="322" fill="url(#sky2)"/>
      <circle cx="380" cy="118" r="44" fill="#ffffff" fill-opacity=".9"/>
      <circle cx="380" cy="118" r="30" fill="#ffd36b"/>
      <path d="M34 300 L160 180 L250 260 L345 165 L486 290 L486 356 L34 356 Z" fill="#3fb86b"/>
      <path d="M34 356 L150 270 L260 330 L380 250 L486 330 L486 356 Z" fill="#007f2f"/>
      <path d="M160 180 L190 208 L172 214 L160 200 L146 214 L132 206 Z" fill="#ffffff" fill-opacity=".85"/>
      <path d="M345 165 L372 190 L356 196 L345 183 L332 196 L318 189 Z" fill="#ffffff" fill-opacity=".85"/>
    </g>
    <rect x="34" y="384" width="230" height="16" rx="8" fill="#dfeee4"/>
    <rect x="34" y="414" width="150" height="13" rx="6.5" fill="#edf5ef"/>
    <circle cx="462" cy="406" r="22" fill="#e9f6ee"/>
    <path d="M462 418 C450 409 444 403 444 397 C444 391 449 387 454 387 C457.5 387 460.5 389 462 392 C463.5 389 466.5 387 470 387 C475 387 480 391 480 397 C480 403 474 409 462 418 Z" fill="#009c39"/>
  </g>

  <!-- Bande de vignettes -->
  <g transform="translate(470 735)" filter="url(#shadowSm)">
    <rect width="330" height="104" rx="22" fill="#ffffff"/>
    <rect x="18" y="18" width="68" height="68" rx="14" fill="#bfe6cc"/>
    <path d="M18 72 L42 50 L60 66 L86 44 L86 72 Q86 86 72 86 L32 86 Q18 86 18 72 Z" fill="#009c39"/>
    <rect x="96" y="18" width="68" height="68" rx="14" fill="#fff1c9"/>
    <circle cx="130" cy="52" r="16" fill="#ffc94a"/>
    <rect x="174" y="18" width="68" height="68" rx="14" fill="#d4f0dd"/>
    <path d="M174 70 C195 52 215 66 242 50 L242 72 Q242 86 228 86 L188 86 Q174 86 174 72 Z" fill="#3fb86b"/>
    <rect x="252" y="18" width="60" height="68" rx="14" fill="#009c39"/>
    <path d="M276 40 L276 64 M264 52 L288 52" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Appareil photo -->
  <g transform="translate(1030 640)" filter="url(#shadowSm)">
    <rect width="200" height="200" rx="44" fill="url(#green)"/>
    <path d="M58 76 L78 76 L88 60 L112 60 L122 76 L142 76 Q154 76 154 88 L154 136 Q154 148 142 148 L58 148 Q46 148 46 136 L46 88 Q46 76 58 76 Z" fill="none" stroke="#ffffff" stroke-width="8" stroke-linejoin="round"/>
    <circle cx="100" cy="112" r="22" fill="none" stroke="#ffffff" stroke-width="8"/>
    <circle cx="138" cy="94" r="5" fill="#ffffff"/>
  </g>

  <!-- Éclats -->
  <g fill="#009c39">
    <path d="M300 200 l8 22 22 8 -22 8 -8 22 -8 -22 -22 -8 22 -8 z" fill-opacity=".55"/>
    <path d="M1290 470 l6 16 16 6 -16 6 -6 16 -6 -16 -16 -6 16 -6 z" fill-opacity=".45"/>
    <path d="M1180 150 l5 13 13 5 -13 5 -5 13 -5 -13 -13 -5 13 -5 z" fill-opacity=".35"/>
    <circle cx="420" cy="660" r="7" fill-opacity=".35"/>
    <circle cx="1300" cy="300" r="9" fill-opacity=".25"/>
    <circle cx="760" cy="150" r="6" fill-opacity=".3"/>
  </g>
</svg>
