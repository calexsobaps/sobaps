<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef8f1"/>
      <stop offset="1" stop-color="#cfeeda"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2" fill="#009c39" fill-opacity=".10"/>
    </pattern>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14b04d"/>
      <stop offset="1" stop-color="#007a2c"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1fb556"/>
      <stop offset="1" stop-color="#00802f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="26" flood-color="#00591f" flood-opacity=".22"/>
    </filter>
    <filter id="shadowSm" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#00591f" flood-opacity=".25"/>
    </filter>
    <clipPath id="heroClip"><rect x="30" y="74" width="500" height="196" rx="16"/></clipPath>
  </defs>

  <!-- Fond -->
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#dots)"/>
  <circle cx="1250" cy="200" r="300" fill="#ffffff" fill-opacity=".45"/>
  <circle cx="320" cy="850" r="240" fill="#009c39" fill-opacity=".07"/>
  <circle cx="800" cy="500" r="420" fill="none" stroke="#009c39" stroke-opacity=".10" stroke-width="2" stroke-dasharray="6 14"/>

  <!-- Journal plié (arrière) -->
  <g transform="translate(300 230) rotate(-10 230 230)" filter="url(#shadow)">
    <rect width="460" height="470" rx="18" fill="#ffffff"/>
    <rect x="30" y="30" width="400" height="58" rx="10" fill="#e9f6ee"/>
    <text x="46" y="72" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-weight="700" letter-spacing="6" fill="#007a2c">INFOS</text>
    <rect x="30" y="104" width="400" height="4" rx="2" fill="#009c39" fill-opacity=".5"/>
    <rect x="30" y="126" width="190" height="120" rx="10" fill="#d4f0dd"/>
    <path d="M30 222 L80 180 L120 210 L165 168 L220 214 L220 236 Q220 246 210 246 L40 246 Q30 246 30 236 Z" fill="#3fb86b"/>
    <g fill="#e3efe7">
      <rect x="240" y="128" width="190" height="12" rx="6"/>
      <rect x="240" y="152" width="170" height="10" rx="5"/>
      <rect x="240" y="172" width="185" height="10" rx="5"/>
      <rect x="240" y="192" width="150" height="10" rx="5"/>
      <rect x="240" y="212" width="175" height="10" rx="5"/>
      <rect x="240" y="232" width="120" height="10" rx="5"/>
      <rect x="30" y="270" width="190" height="10" rx="5"/>
      <rect x="30" y="290" width="170" height="10" rx="5"/>
      <rect x="30" y="310" width="185" height="10" rx="5"/>
      <rect x="30" y="330" width="140" height="10" rx="5"/>
      <rect x="240" y="270" width="190" height="10" rx="5"/>
      <rect x="240" y="290" width="160" height="10" rx="5"/>
      <rect x="240" y="310" width="180" height="10" rx="5"/>
      <rect x="240" y="330" width="130" height="10" rx="5"/>
    </g>
  </g>

  <!-- Article à la une (navigateur) -->
  <g transform="translate(560 220)" filter="url(#shadow)">
    <rect width="560" height="470" rx="26" fill="#ffffff"/>
    <circle cx="40" cy="40" r="7" fill="#ff8a7a"/>
    <circle cx="62" cy="40" r="7" fill="#ffd36b"/>
    <circle cx="84" cy="40" r="7" fill="#7fd29c"/>
    <rect x="112" y="30" width="300" height="20" rx="10" fill="#f0f6f2"/>
    <g clip-path="url(#heroClip)">
      <rect x="30" y="74" width="500" height="196" fill="url(#hero)"/>
      <circle cx="450" cy="110" r="90" fill="#ffffff" fill-opacity=".08"/>
      <circle cx="90" cy="260" r="110" fill="#ffffff" fill-opacity=".06"/>
      <!-- Croix santé -->
      <g transform="translate(240 112)">
        <rect width="120" height="120" rx="30" fill="#ffffff" fill-opacity=".16"/>
        <path d="M46 24 h28 v22 h22 v28 h-22 v22 h-28 v-22 h-22 v-28 h22 z" fill="#ffffff"/>
      </g>
    </g>
    <rect x="50" y="92" width="88" height="28" rx="14" fill="#ffffff"/>
    <circle cx="68" cy="106" r="5" fill="#e5484d"/>
    <rect x="80" y="101" width="46" height="10" rx="5" fill="#009c39"/>
    <rect x="30" y="296" width="400" height="22" rx="11" fill="#1f2a23"/>
    <rect x="30" y="330" width="290" height="22" rx="11" fill="#1f2a23"/>
    <g fill="#e3efe7">
      <rect x="30" y="374" width="480" height="12" rx="6"/>
      <rect x="30" y="396" width="440" height="12" rx="6"/>
      <rect x="30" y="418" width="350" height="12" rx="6"/>
    </g>
  </g>

  <!-- Cloche de notification -->
  <g transform="translate(1070 150)" filter="url(#shadowSm)">
    <rect width="150" height="150" rx="38" fill="#ffffff"/>
    <path d="M75 38 C55 38 44 54 44 72 L44 92 L34 106 L116 106 L106 92 L106 72 C106 54 95 38 75 38 Z" fill="#009c39"/>
    <path d="M62 112 Q75 128 88 112 Z" fill="#009c39"/>
    <circle cx="112" cy="40" r="20" fill="#e5484d" stroke="#ffffff" stroke-width="5"/>
    <text x="112" y="47.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#ffffff">3</text>
  </g>

  <!-- Mégaphone -->
  <g transform="translate(1030 620)" filter="url(#shadowSm)">
    <rect width="210" height="210" rx="46" fill="url(#green)"/>
    <path d="M52 92 L80 92 L136 60 L136 150 L80 118 L52 118 Q44 118 44 110 L44 100 Q44 92 52 92 Z" fill="#ffffff"/>
    <path d="M70 118 L80 154 Q82 160 88 160 L98 160 Q104 160 102 154 L92 124 Z" fill="#ffffff"/>
    <path d="M154 84 Q170 105 154 126" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
    <path d="M168 68 Q194 105 168 142" fill="none" stroke="#ffffff" stroke-opacity=".6" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Calendrier -->
  <g transform="translate(420 730)" filter="url(#shadowSm)">
    <rect width="300" height="110" rx="24" fill="#ffffff"/>
    <rect x="18" y="18" width="74" height="74" rx="16" fill="#e9f6ee"/>
    <rect x="18" y="18" width="74" height="24" rx="12" fill="#009c39"/>
    <rect x="18" y="30" width="74" height="12" fill="#009c39"/>
    <rect x="34" y="12" width="8" height="16" rx="4" fill="#007a2c"/>
    <rect x="68" y="12" width="8" height="16" rx="4" fill="#007a2c"/>
    <g fill="#009c39">
      <rect x="30" y="52" width="12" height="12" rx="3" fill-opacity=".35"/>
      <rect x="49" y="52" width="12" height="12" rx="3"/>
      <rect x="68" y="52" width="12" height="12" rx="3" fill-opacity=".35"/>
      <rect x="30" y="70" width="12" height="12" rx="3" fill-opacity=".35"/>
      <rect x="49" y="70" width="12" height="12" rx="3" fill-opacity=".35"/>
      <rect x="68" y="70" width="12" height="12" rx="3" fill-opacity=".35"/>
    </g>
    <rect x="110" y="32" width="160" height="16" rx="8" fill="#1f2a23"/>
    <rect x="110" y="62" width="120" height="12" rx="6" fill="#e3efe7"/>
  </g>

  <!-- Éclats -->
  <g fill="#009c39">
    <path d="M300 190 l8 22 22 8 -22 8 -8 22 -8 -22 -22 -8 22 -8 z" fill-opacity=".55"/>
    <path d="M1300 460 l6 16 16 6 -16 6 -6 16 -6 -16 -16 -6 16 -6 z" fill-opacity=".45"/>
    <path d="M940 140 l5 13 13 5 -13 5 -5 13 -5 -13 -13 -5 13 -5 z" fill-opacity=".35"/>
    <circle cx="420" cy="660" r="7" fill-opacity=".35"/>
    <circle cx="1310" cy="330" r="9" fill-opacity=".25"/>
    <circle cx="760" cy="160" r="6" fill-opacity=".3"/>
  </g>
</svg>
